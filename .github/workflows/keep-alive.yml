# Keeps the Render free instance awake by hitting /health.
#
# Render spins a free web service down after ~15 minutes with no inbound
# traffic, and the next request then takes 30-60s to wake it — longer than an
# MCP client's connect timeout, so it looks like "failed to connect".
#
# Setup: repo → Settings → Secrets and variables → Actions → Variables →
#   New repository variable: RENDER_HEALTH_URL = https://<your-service>.onrender.com/health
#
# This is a workaround for the free plan. `plan: starter` in render.yaml removes
# the problem outright and is the better answer if the service matters.

name: keep-alive

on:
  schedule:
    # Every 10 minutes, to stay inside the ~15 minute idle window. GitHub delays
    # scheduled runs under load — sometimes past 15 min — so treat this as best
    # effort, not a guarantee the service is never cold.
    - cron: "*/10 * * * *"
  # Lets you wake the service by hand: Actions → keep-alive → Run workflow.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::error::RENDER_HEALTH_URL repository variable is not set — see this file's header."
            exit 1
          fi
          # --max-time 90 because a cold start can take a minute; a short timeout
          # would abort exactly when the wake-up is doing its job.
          body=$(curl -sS --fail --max-time 90 --retry 2 --retry-delay 15 "$HEALTH_URL")
          echo "$body"
