# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Hosts the Streamable HTTP transport (src/http.js) so remote clients that
# cannot spawn a local process — ChatGPT connectors, Claude Code over `--transport http` —
# can reach askDB. The stdio entry point is not used here.
#
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
# You will be asked for PINECONE_API_KEY; everything else is set below.

services:
  - type: web
    name: askdb-mcp
    runtime: node
    plan: free # free instances sleep after 15 min idle — see DEPLOY.md
    region: oregon # singapore / frankfurt / ohio / oregon / virginia
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:http
    # Unauthenticated by design, so Render's prober can reach it without the token.
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: NODE_VERSION
        value: "22"

      # Render routes to $PORT on all interfaces; the app defaults to loopback
      # for local use, so it must be widened here or health checks never pass.
      - key: HTTP_HOST
        value: 0.0.0.0
      - key: HTTP_PATH
        value: /mcp

      # Entered once in the dashboard at deploy time, never committed.
      - key: PINECONE_API_KEY
        sync: false

      # Render generates a random value. Read it from the service's Environment
      # tab and hand it to each client as `Authorization: Bearer <token>`.
      # Without this, anyone with the URL can read your entire schema.
      - key: MCP_AUTH_TOKEN
        generateValue: true

      - key: PINECONE_INDEX
        value: ask-db
      # Must match the model the schema was upserted with, or every score is noise.
      - key: EMBED_MODEL
        value: multilingual-e5-large
      - key: TOP_K
        value: "8"

      # Optional — uncomment and set in the dashboard if you need them:
      # - key: PINECONE_NAMESPACE
      #   sync: false
      # - key: DEFAULT_DATABASE    # scope every lookup to one database
      #   sync: false
      # - key: SQL_DIALECT
      #   value: ANSI SQL
      # - key: RERANK_MODEL        # e.g. bge-reranker-v2-m3
      #   sync: false
